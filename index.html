<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="google-adsense-account"
      content="ca-pub-6663361980769657"
    />

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6663361980769657"
      crossorigin="anonymous"
    ></script>

    <!-- Google Analytics 4 -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-8Y6HLGQCB9"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-8Y6HLGQCB9");
    </script>

    <meta name="theme-color" content="#2563eb" />

    <!--
      Security headers and Content-Security-Policy are enforced
      through the hosting layer (_headers).
    -->

    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <meta
      name="description"
      content="Nyako — free file, image, and PDF tools that run entirely in your browser. Compress, merge, convert, and sign files. No uploads, no signup, no watermarks."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nyako" />

    <meta
      property="og:title"
      content="Nyako — file, image & PDF tools that run in your browser"
    />

    <meta
      property="og:description"
      content="Free file, image, and PDF tools that run entirely in your browser. No uploads, no signup, no watermarks."
    />

    <meta
      property="og:url"
      content="https://nyako.co.in/"
    />

    <meta
      property="og:image"
      content="https://nyako.co.in/og-image.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Nyako — file, image & PDF tools that run in your browser"
    />

    <meta
      name="twitter:description"
      content="Free file, image, and PDF tools that run entirely in your browser. No uploads, no signup, no watermarks."
    />

    <meta
      name="twitter:image"
      content="https://nyako.co.in/og-image.png"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Theme initialization -->
    <script>
      if (
        localStorage.getItem("nyako-theme") === "dark" ||
        (
          !localStorage.getItem("nyako-theme") &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        )
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Nyako",
        "url": "https://nyako.co.in/",
        "applicationCategory": "Utility",
        "operatingSystem": "Any (runs in browser)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Free file, image, and PDF tools that run entirely in your browser. No uploads, no signup, no watermarks."
      }
    </script>

    <title>
      Nyako | Free PDF, Image & File Tools | No Login, No Watermarks
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
